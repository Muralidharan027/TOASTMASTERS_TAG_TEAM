<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <rect width="100" height="100" rx="24" fill="#0F172A" />
  <!-- 2x2 Grid representing T, A, G, T with elegant role colors -->
  <!-- Top-Left: T (Timer - Emerald) -->
  <rect x="14" y="14" width="32" height="32" rx="8" fill="#10B981" fill-opacity="0.25" stroke="#10B981" stroke-width="2"/>
  <text x="30" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="800" fill="#10B981" text-anchor="middle" dominant-baseline="middle">T</text>
  
  <!-- Top-Right: A (Ah-Counter - Orange) -->
  <rect x="54" y="14" width="32" height="32" rx="8" fill="#F97316" fill-opacity="0.25" stroke="#F97316" stroke-width="2"/>
  <text x="70" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="800" fill="#F97316" text-anchor="middle" dominant-baseline="middle">A</text>
  
  <!-- Bottom-Left: G (Grammarian - Violet) -->
  <rect x="14" y="54" width="32" height="32" rx="8" fill="#8B5CF6" fill-opacity="0.25" stroke="#8B5CF6" stroke-width="2"/>
  <text x="30" y="76" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="800" fill="#8B5CF6" text-anchor="middle" dominant-baseline="middle">G</text>
  
  <!-- Bottom-Right: T (Trivia - Sky) -->
  <rect x="54" y="54" width="32" height="32" rx="8" fill="#0284C7" fill-opacity="0.25" stroke="#0284C7" stroke-width="2"/>
  <text x="70" y="76" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="800" fill="#0284C7" text-anchor="middle" dominant-baseline="middle">T</text>
</svg>